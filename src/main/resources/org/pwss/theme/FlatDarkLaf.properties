# Integrity Hash - dark palette.

@background = #1c1f26
@foreground = #d8dce4
@accentColor = #5b9cf5

@componentBackground = lighten(@background,3%)
@buttonBackground = lighten(@background,8%)
@menuBackground = lighten(@background,4%)

@selectionBackground = mix(@accentColor,@background,32%)
@selectionForeground = #ffffff
@selectionInactiveBackground = lighten(@background,10%)

Table.gridColor = lighten(@background,7%)
TableHeader.separatorColor = lighten(@background,10%)
TableHeader.bottomSeparatorColor = lighten(@background,10%)

# ---- Application colours ----
App.okColor = #4cc38a
App.warnColor = #e5a84b
App.errorColor = #e5605a
App.mutedForeground = #8d95a3
App.bannerBackground = mix(#e5a84b,@background,14%)
App.wellBackground = lighten(@background,5%)
App.navSelectedBackground = mix(@accentColor,@background,22%)
App.navHoverBackground = lighten(@background,6%)
App.tableStripeBackground = lighten(@background,5%)
App.tableHoverBackground = lighten(@background,9%)

# ---- Hues for icons, tiles and badges (App.hue0 is the accent) ----
App.hue1 = #f0a35e
App.hue2 = #3cc7b4
App.hue3 = #a58bf5
App.hue4 = #f07aa8
