# Integrity Hash - light palette.

@background = #f5f6f8
@foreground = #1f2430
@accentColor = #2f6fe4

@componentBackground = #ffffff
@buttonBackground = #ffffff
@menuBackground = #ffffff

@selectionBackground = mix(@accentColor,#ffffff,16%)
@selectionForeground = @foreground
@selectionInactiveBackground = darken(@background,5%)

Table.gridColor = darken(@background,4%)
TableHeader.separatorColor = darken(@background,8%)
TableHeader.bottomSeparatorColor = darken(@background,8%)

# ---- Application colours ----
App.okColor = #1f9d63
App.warnColor = #c77d0a
App.errorColor = #d6423b
App.mutedForeground = #6b7280
App.bannerBackground = mix(#e5a84b,#ffffff,18%)
App.wellBackground = #ffffff
App.navSelectedBackground = mix(@accentColor,#ffffff,14%)
App.navHoverBackground = darken(@background,4%)
App.tableStripeBackground = #f8f9fb
App.tableHoverBackground = #eef1f6

# ---- Hues for icons, tiles and badges (App.hue0 is the accent) ----
App.hue1 = #c2600f
App.hue2 = #0f8a7a
App.hue3 = #7048d8
App.hue4 = #c0267a
