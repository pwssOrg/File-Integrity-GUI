# Integrity Hash - shared look and feel overrides (all themes).
# Loaded by FlatLaf through AppLookAndFeel (registerCustomDefaultsSource).

# ---- Typography ----
defaultFont = +1

# ---- Shape ----
Button.arc = 10
Component.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
ScrollPane.arc = 12
Popup.borderCornerRadius = 10

# ---- Spacing ----
@componentMargin = 6,10,6,10
Button.margin = 6,16,6,16
Component.focusWidth = 1
Component.innerFocusWidth = 0

# ---- Scroll bars ----
ScrollBar.width = 12
ScrollBar.thumbInsets = 3,3,3,3
ScrollBar.thumbArc = 999

# ---- Tables ----
# (row and header rendering lives in org.pwss.view.theme.TableStyle)
Table.rowHeight = 46
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
TableHeader.height = 40
TableHeader.background = @componentBackground

# ---- Lists ----
List.cellMargins = 7,12,7,12
List.selectionArc = 8
List.selectionInsets = 1,6,1,6

# ---- Combo boxes and menus ----
ComboBox.selectionArc = 8
ComboBox.selectionInsets = 0,4,0,4
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,5,0,5
MenuItem.margin = 6,12,6,12
PopupMenu.borderInsets = 6,1,6,1

# ---- Tabs ----
TabbedPane.tabHeight = 42
TabbedPane.tabInsets = 6,16,6,16
TabbedPane.tabSelectionHeight = 3
TabbedPane.tabSelectionArc = 999
TabbedPane.showTabSeparators = false

# ---- Split panes ----
SplitPane.dividerSize = 14
SplitPaneDivider.gripDotCount = 3

# ---- Progress and sliders ----
ProgressBar.horizontalSize = 146,6
Slider.trackWidth = 4
Slider.thumbSize = 16,16

# ---- Dialogs ----
OptionPane.border = 20,24,16,24
OptionPane.buttonAreaBorder = 18,0,0,0
OptionPane.buttonMinimumWidth = {scaledInteger}88

# ---- Style classes (use with the FlatLaf.styleClass client property) ----
[style]Button.primary = \
	background: @accentColor; \
	foreground: #fff; \
	hoverBackground: lighten(@accentColor,5%); \
	pressedBackground: darken(@accentColor,6%); \
	focusedBackground: @accentColor; \
	borderWidth: 0; \
	font: $semibold.font

[style]Button.danger = \
	background: $App.errorColor; \
	foreground: #fff; \
	hoverBackground: lighten($App.errorColor,5%); \
	pressedBackground: darken($App.errorColor,6%); \
	focusedBackground: $App.errorColor; \
	borderWidth: 0; \
	font: $semibold.font

[style]Label.muted = foreground: $App.mutedForeground
[style]Panel.banner = arc: 14; background: $App.bannerBackground
[style]Panel.well = arc: 10; background: $App.wellBackground
